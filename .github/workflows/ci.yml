name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Build-time env only. CI deliberately holds NO runtime/god keys: the
    # service-role key, AI keys, and ADMIN_EMAIL are all read at request time
    # inside handlers, which CI never executes since the E2E step was removed
    # (2026-06-11 — it ran one login spec against PROD infra with the prod
    # service-role key; all risk, near-zero coverage). E2E still runs locally
    # via ALLOW_E2E_AGAINST_REMOTE=1; the full CI e2e rail against a dedicated
    # test project is a post-launch item (docs/implementation_plan_2026_06.md
    # item 1). The NEXT_PUBLIC values are publishable client config, not secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
